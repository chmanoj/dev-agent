site_name: dev-agent
site_description: AI-powered development workflow assistant
site_url: https://dev-agent.github.io/dev-agent/
repo_url: https://github.com/dev-agent/dev-agent
repo_name: dev-agent/dev-agent

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_toc_entry: false
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
  - git-revision-date-localized:
      enable_creation_date: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - footnotes
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Configuration:
    - Azure OpenAI Setup: configuration/azure-openai.md
    - Troubleshooting: configuration/troubleshooting.md
  - User Guide:
    - CLI Usage: usage/cli.md
    - Workflow Guide: usage/workflow.md
    - Cost Management: usage/cost-management.md
    - Configuration: usage/configuration.md
  - API Reference:
    - LLM Integration: api/llm.md
    - CLI Module: api/cli.md
    - Models: api/models.md
    - Workflow: api/workflow.md
    - Analysis: api/analysis.md
    - Audit: api/audit.md
    - Cleanup: api/cleanup.md
    - Onboarding: api/onboarding.md
  - Development:
    - Contributing: development/contributing.md
    - Architecture: development/architecture.md
    - LLM Integration: development/llm-integration.md
    - Testing: development/testing.md
    - Deployment: development/deployment.md
    - Cleanup Summary: development/cleanup-summary.md
  - Examples:
    - Azure Setup: examples/azure-setup.md
    - Basic Usage: examples/basic-usage.md
    - Advanced Patterns: examples/advanced.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/dev-agent/dev-agent
  version:
    provider: mike